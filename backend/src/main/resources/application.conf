isDevelopment = "${DEVELOPMENT:-false}"

application {
  name = "${NAIS_APP_NAME:-emottak-monitor}"
  port = "${APPLICATION_PORT:-8080}"
  threads = "${APPLICATION_THREADS:-1}"
  emottakFrontEndUrl = "${EMOTTAK_ADMIN_FRONTEND_URL:-}"
  oidcWellKnownUriUrl = "${AZURE_APP_WELL_KNOWN_URL:-}"
  emottakMonitorClientId = "${AZURE_APP_EMOTTAK_CLIENT_ID:-}"
}

database {
  url = "${DATABASE_URL:-}"
  prefix = "${DATABASE_PREFIX:-}"
  maximumPoolSize = 3
}

backendEndpoints {
  eventManagerUrl = "${EVENT_MANAGER_URL:-localhost:8080}"
  cpaRepoUrl = "${CPA_REPO_URL:-localhost:8080}"
}

kafka {
  groupId = "emottak-monitor"
}

retryConsumer {
  active = "${ENABLE_RETRY_KAFKA_CONSUMER:-false}"
  retryTopic = "${RETRY_TOPIC:-team-emottak.ebxml.retry}"
  consumerGroupId = "emottak-monitor"
  maxMessages = "${RETRY_MAX_MESSAGES:-1000}"
  readTimeoutSeconds = "${RETRY_READ_TIMEOUT_SECONDS:-30}"
}
