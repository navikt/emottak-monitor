application {
  name = "${NAIS_APP_NAME:-emottak-monitor}"
  port = "${APPLICATION_PORT:-8080}"
  threads = "${APPLICATION_THREADS:-1}"
  emottakFrontEndUrl = "${EMOTTAK_ADMIN_FRONTEND_URL:-}"
  oidcWellKnownUriUrl = "${AZURE_APP_WELL_KNOWN_URL:-}"
  emottakMonitorClientId = "${AZURE_APP_EMOTTAK_CLIENT_ID:-}"
}

database {
  url = "${DATABASE_URL:-}"
  prefix = "${DATABASE_PREFIX:-}"
  maximumPoolSize = 3
}
