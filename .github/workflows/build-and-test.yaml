name: Build and test

on:
  workflow_dispatch:
  pull_request:

jobs:
  build-frontend:
    name: "Build frontend"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: cd frontend && yarn install --frozen-lockfile

      # Build & test frontend + Docker Image
      - name: 'yarn build'
        run: cd frontend && yarn build
      - name: Build frontend container image
        run: docker build -f frontend/Dockerfile -t emottak-monitor-frontend:ci frontend
      - name: Guard frontend container startup
        run: |
          set -euo pipefail
          container_name=emottak-monitor-frontend-ci
          host_port=18080
          started=false

          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --rm \
            --name "$container_name" \
            -p "${host_port}:8080" \
            -e REACT_APP_URL="https://example.com" \
            emottak-monitor-frontend:ci >/dev/null

          for _ in $(seq 1 30); do
            if ! docker ps --format '{{.Names}}' | grep -q "^${container_name}$"; then
              echo "Frontend container exited before becoming healthy."
              docker logs "$container_name" || true
              exit 1
            fi
            if curl -fsS "http://127.0.0.1:${host_port}/" >/dev/null; then
              started=true
              break
            fi
            sleep 1
          done

          docker logs "$container_name"
          if [ "$started" != "true" ]; then
            echo "Frontend container did not start successfully within timeout."
            exit 1
          fi

  build-backend:
    name: "Build and test backend"
    runs-on: ubuntu-latest
    needs: build-frontend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-cache-${{ hashFiles('backend/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-cache-
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-
      - run: cd backend && ./gradlew test
        env:
          ORG_GRADLE_PROJECT_githubUser: x-access-token
          ORG_GRADLE_PROJECT_githubPassword: ${{ secrets.GITHUB_TOKEN }}
      - run: cd backend && ./gradlew shadowJar -x test
        env:
          ORG_GRADLE_PROJECT_githubUser: x-access-token
          ORG_GRADLE_PROJECT_githubPassword: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend container image
        run: docker build -f backend/Dockerfile -t emottak-monitor-backend:ci backend
      - name: Guard startup failure clarity
        run: |
          set +e
          docker run --rm emottak-monitor-backend:ci > /tmp/backend-container-startup.log 2>&1
          exit_code=$?
          set -e
          cat /tmp/backend-container-startup.log

          if [ "$exit_code" -eq 0 ]; then
            echo "Expected startup to fail without required runtime environment variables."
            exit 1
          fi

          if ! grep -q 'Missing required variable "' /tmp/backend-container-startup.log; then
            echo "Unexpected startup failure. Expected missing environment variable error."
            exit 1
          fi
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
